[package]
name = "sea-chat-inference"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
solana-program = "=2.3.0"

[features]
no-entrypoint = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dev-dependencies]
memmap2 = "0.9"
serde_json = "1"
