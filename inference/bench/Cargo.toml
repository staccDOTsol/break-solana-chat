[package]
name = "sea-chat-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
mollusk-svm = "=0.15.1"
# Mollusk 0.15 uses the Agave 4.2 runtime API; 4.3 changes its public methods.
solana-program-runtime = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-transaction-context = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-account = "4.3.0"
solana-instruction = "3.2.0"
solana-pubkey = "4.1.0"
serde_json = "1"

[profile.release]
opt-level = 3
