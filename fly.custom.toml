app = "break-solana-chat"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 60

[env]
  SEA_RPC_URL = "https://rpc-model.staccpad.fun/"
  SEA_PUBLIC_RPC_URL = "https://rpc-model.staccpad.fun"
  SEA_WS_URL = "wss://rpc-model.staccpad.fun/"
  SEA_EXPECTED_GENESIS = "3E5sqjXQ2FKbGGEqmwbrhYwynrjUGwhNJUvQcU5t5q6P"
  SEA_RPC_RACE_URLS = ""
  SEA_INDEPENDENT_SLICES = "1"
  SEA_SESSION_DIRECTORY = "/data/chat-sessions-3E5sqjXQ2FKbGGEqmwbrhYwynrjUGwhNJUvQcU5t5q6P"
  SEA_SPONSOR_KEYPAIR = "/run/custom-sponsor.json"

[build]
  dockerfile = "Dockerfile.custom"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "chat_data"
  destination = "/data"

[[files]]
  guest_path = "/run/custom-sponsor.json"
  secret_name = "SEA_CUSTOM_SPONSOR_KEYPAIR_B64"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
